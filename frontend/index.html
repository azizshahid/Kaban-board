<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Productivity Board</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./panels.css" />
    <link rel="stylesheet" href="./theme.css" />
  </head>
  <body>
    <div class="kanban-board">
      <header class="board-header">
        <div>
          <p class="eyebrow">PERSONAL WORKSPACE</p>
          <h1>My Productivity Board</h1>
        </div>

        <div class="board-actions">
          <button type="button" id="add-task-btn">＋ Add Task</button>
          <button type="button" id="review-btn" class="ghost-btn">End-of-day review</button>
          <label class="reminder-setting">
            Remind every
            <select id="reminder-interval">
              <option value="15">15 min</option>
              <option value="30">30 min</option>
              <option value="60">60 min</option>
              <option value="0">Off</option>
            </select>
          </label>
          <label class="reminder-setting">
            Theme
            <select id="theme-select">
              <option value="system">System</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </label>
        </div>
      </header>

      <div class="board-meta">
        <span id="today-label" class="board-info"></span>
        <div class="board-info">
          <span>▣ <span id="total-count">0</span> Tasks</span>
        </div>
      </div>

      <main class="kanban-columns">
        <section class="kanban-column" data-status="todo">
          <header class="column-header">
            <div>
              <span class="status-dot gray"></span>
              <h2>To Do</h2>
              <span class="task-count" id="count-todo">0</span>
            </div>
            <button type="button" class="column-add" data-status="todo" aria-label="Add to To Do">＋</button>
          </header>
          <div class="task-list" id="list-todo"></div>
        </section>

        <section class="kanban-column" data-status="progress">
          <header class="column-header">
            <div>
              <span class="status-dot orange"></span>
              <h2>In Progress</h2>
              <span class="task-count" id="count-progress">0</span>
            </div>
            <button type="button" class="column-add" data-status="progress" aria-label="Add to In Progress">＋</button>
          </header>
          <div class="task-list" id="list-progress"></div>
        </section>

        <section class="kanban-column" data-status="done">
          <header class="column-header">
            <div>
              <span class="status-dot green"></span>
              <h2>Completed</h2>
              <span class="task-count" id="count-done">0</span>
            </div>
            <button type="button" class="column-add" data-status="done" aria-label="Add to Completed">＋</button>
          </header>
          <div class="task-list" id="list-done"></div>
        </section>
      </main>

      <section class="notes-panel" aria-labelledby="notes-title">
        <h2 id="notes-title">Notes</h2>
        <form id="note-form">
          <select id="note-category" aria-label="Note category">
            <option value="habit">Habit</option>
            <option value="reflection">Reflection</option>
            <option value="time management">Time management</option>
            <option value="critique">Critique</option>
            <option value="other">Other</option>
          </select>
          <textarea id="note-text" rows="3" placeholder="Write a note..."></textarea>
          <button type="submit" class="action-btn">Add note</button>
        </form>
        <ul id="notes-list" class="notes-list"></ul>
      </section>
    </div>

    <dialog id="task-dialog">
      <form id="task-form">
        <h2 id="dialog-title">New Task</h2>
        <input type="text" id="task-title" placeholder="Title" required />
        <input type="text" id="task-desc" placeholder="Description" />
        <input type="text" id="task-label" placeholder="Label (e.g. Design)" />
        <select id="task-status" aria-label="Status">
          <option value="todo">To Do</option>
          <option value="progress">In Progress</option>
          <option value="done">Completed</option>
        </select>
        <input type="date" id="task-date" required />
        <div class="dialog-buttons">
          <button type="button" id="delete-btn" hidden>Delete</button>
          <button type="button" id="cancel-btn">Cancel</button>
          <button type="submit" id="submit-btn">Add</button>
        </div>
      </form>
    </dialog>

    <dialog id="review-dialog">
      <form id="review-form">
        <h2>End-of-day review</h2>
        <p id="review-summary" class="review-summary"></p>
        <ul id="review-list" class="review-list"></ul>
        <textarea id="review-text" rows="4" placeholder="What went well? What would you change tomorrow?"></textarea>
        <div class="dialog-buttons">
          <button type="button" id="review-close" class="ghost-btn">Close</button>
          <button type="submit">Save reflection</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" hidden></div>

    <script type="module" src="./index.js"></script>
  </body>
</html>
